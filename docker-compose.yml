version: '3.9'

networks:
  biteplate-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: biteplate-postgres
    environment:
      POSTGRES_DB: biteplate
      POSTGRES_USER: biteplate
      POSTGRES_PASSWORD: ${DB_PASS:-biteplate_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biteplate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biteplate-network

  redis:
    image: redis:7-alpine
    container_name: biteplate-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biteplate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biteplate-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/biteplate
      DB_USER: biteplate
      DB_PASS: ${DB_PASS:-biteplate_dev}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-64-chars-long-random-string}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biteplate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biteplate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - biteplate-network
