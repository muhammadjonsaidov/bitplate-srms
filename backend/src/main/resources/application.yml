spring:
  application:
    name: bitplate-srms

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biteplate}
    username: ${DB_USER:biteplate}
    password: ${DB_PASS:biteplate_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-64-chars-long-random}
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.biteplate: INFO
    org.springframework.security: WARN
