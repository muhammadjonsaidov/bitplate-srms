# BitePlate SRMS — Nginx reverse proxy config
# Place this file in /etc/nginx/sites-available/biteplate
# then: sudo ln -s /etc/nginx/sites-available/biteplate /etc/nginx/sites-enabled/

# Frontend — saidovmuhammadjon.me
server {
    listen 80;
    server_name saidovmuhammadjon.me www.saidovmuhammadjon.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name saidovmuhammadjon.me www.saidovmuhammadjon.me;

    # SSL managed by Certbot — do not remove
    ssl_certificate /etc/letsencrypt/live/saidovmuhammadjon.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saidovmuhammadjon.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Backend API — api.saidovmuhammadjon.me
server {
    listen 80;
    server_name api.saidovmuhammadjon.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.saidovmuhammadjon.me;

    # SSL — run: sudo certbot --nginx -d api.saidovmuhammadjon.me
    ssl_certificate /etc/letsencrypt/live/api.saidovmuhammadjon.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saidovmuhammadjon.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui.html {
        proxy_pass http://localhost:8080/swagger-ui.html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
